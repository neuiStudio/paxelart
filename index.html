/* ============================================================ */
/* Known limitations of this prototype (not blocking)            */
/* ============================================================ */
// 2.1 — Mutations now write directly to their own row (insertPhrase,
//       insertLink, insertComment, etc.) instead of read-modify-writing a
//       whole blob, and the two counters most likely to be hit
//       concurrently — link weight and ancestor impact bonus — use atomic
//       Postgres RPCs (increment_link_weight / increment_impact_bonus), so
//       the original whole-graph race from the window.storage version is
//       gone. Not fully atomic still: two people duplicate-checking and
//       creating the "same" phrase at the exact same instant could both
//       succeed (a classic check-then-act race) — closing that would need
//       a unique constraint on the normalized text, server-side.
// 2.2 — "Identity" is just a free-text name (see saveIdentity), with no
//       password or verification: anyone can type a name already used by
//       someone else. A production version needs real authentication
//       (email/password or social login, e.g. Supabase Auth) before
//       allowing creating, connecting, combining, or commenting.
// 2.3 — cascadeAncestorBonus() adds +1 equally to every ancestor in the
//       chain, with no decay across generations. Documented as a Phase 2/3
//       improvement (e.g. bonus = 0.5^generation), not blocking for the MVP.
// 2.4 — submitReport() isolates a phrase immediately on a single report if
//       the reason is "severe", with no cross-check: a malicious report
//       could isolate an innocent phrase instantly. Kept as a precaution
//       for the MVP, but an appeal or human review step should exist
//       before any permanent removal.
// 2.5 — No rate limiting on how many phrases, connections, or comments one

//       but should be added before exposing this publicly.
// 2.6 — RESOLVED: persistence now runs on Supabase (Postgres) instead of

//       supabase-schema.sql has been run. Its RLS policies are

//       read/write every table — to match the no-real-auth model from
//       2.2. Tighten both together before a real public launch.

/* ============================================================ */
/* Utilities: normalization, Levenshtein, validation             */
/* ============================================================ */

const WORD_MIN = 2;
const WORD_MAX = 25;
const DUPLICATE_RATIO = 0.09;
const COMMENT_MAX = 240;
const ISOLATION_THRESHOLD = 3;

const NAME_MIN = 3;
const NAME_MAX = 20;
const NAME_PATTERN = /^[a-zA-Z0-9_]+$/;

const REPORT_REASONS = [
  { key: "spam", label: "Spam or advertising", severe: false },
  { key: "hate", label: "Hate or harassment", severe: true },
  { key: "sexual", label: "Explicit sexual content", severe: true },
  { key: "threat", label: "Threats or incitement to violence", severe: true },
  { key: "other", label: "Other", severe: false },
];

function normalizeText(text) {
  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^\w\s]|_/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  let prev = new Array(n + 1), curr = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    curr[0] = i;
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost);
    }
    [prev, curr] = [curr, prev];
  }
  return prev[n];
}

function validatePhraseText(raw) {
  const text = (raw || "").trim();
  if (!text) return "Write something before publishing.";
  const words = text.split(/\s+/).filter(Boolean);
  if (words.length < WORD_MIN) return `Needs at least ${WORD_MIN} words.`;
  if (words.length > WORD_MAX) return `Can't exceed ${WORD_MAX} words.`;
  if (/https?:\/\/|www\.|\b[a-z0-9-]+\.(com|net|org|io|es|co|dev|app)\b/i.test(text)) {
    return "Links aren't allowed inside a phrase.";
  }
  if (/[^\s@]+@[^\s@]+\.[^\s@]+/.test(text)) {
    return "Email addresses aren't allowed.";
  }
  const letters = text.replace(/[^a-zA-ZÀ-ÿ]/g, "");
  if (letters.length > 10 && text === text.toUpperCase() && text !== text.toLowerCase()) {
    return "Avoid writing everything in capital letters.";
  }
  if (/(.)\1{5,}/.test(text)) return "Too many repeated characters in a row.";
  if (/<script|<\?php|<iframe|javascript:/i.test(text)) return "The phrase contains patterns that aren't allowed.";
  return null;
}

// 1.7 — username validation: length + allowed characters, mirroring
// validatePhraseText's shape so it surfaces a clear message instead of
// silently accepting anything.
function validateUsername(raw) {
  const name = (raw || "").trim();
  if (!name) return "Enter a name.";
  if (name.length < NAME_MIN) return `Must be at least ${NAME_MIN} characters.`;
  if (name.length > NAME_MAX) return `Can't exceed ${NAME_MAX} characters.`;
  if (!NAME_PATTERN.test(name)) return "Only letters, numbers, and underscores are allowed.";
  return null;
}

function findDuplicate(text, phrases) {
  const norm = normalizeText(text);
  for (const p of phrases) {
    const otherNorm = normalizeText(p.text);
    const maxLen = Math.max(norm.length, otherNorm.length);
    if (maxLen === 0) continue;
    const dist = levenshtein(norm, otherNorm);
    if (dist / maxLen <= DUPLICATE_RATIO) return p;
  }
  return null;
}

function relativeTime(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diff / 60000);
  if (min < 1) return "just now";
  if (min < 60) return `${min} min ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr} h ago`;
  const d = Math.floor(hr / 24);
  if (d < 30) return `${d} d ago`;
  return new Date(iso).toLocaleDateString();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

/* ============================================================ */
/* Persistence — Supabase (shared) + localStorage (personal)     */
/* ============================================================ */

// "me" is purely local to this browser/device — no reason to round-trip
// it through the shared backend.
async function loadPersonal(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw != null ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}
async function savePersonal(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); }
  catch (e) { console.error("localStorage set failed", key, e); }
}

function dbRowToPhrase(r) {
  return {
    id: r.id, text: r.text, owner: r.owner, createdAt: r.created_at,
    parents: r.parent_a && r.parent_b ? [r.parent_a, r.parent_b] : null,
    isolated: r.isolated, impactBonus: r.impact_bonus || 0, reports: [],
  };
}
function dbRowToLink(r) {
  return {
    id: r.id, source: r.source, target: r.target, weight: r.weight,
    type: r.type, createdAt: r.created_at, comments: [],
  };
}

async function fetchGraphFromDB() {
  const [
    { data: phraseRows, error: pErr },
    { data: linkRows, error: lErr },
    { data: commentRows },
    { data: reportRows },
    { data: activityRows },
  ] = await Promise.all([
    sb.from("phrases").select("*"),
    sb.from("links").select("*"),
    sb.from("comments").select("*"),
    sb.from("reports").select("*"),
    sb.from("activity").select("*").order("created_at", { ascending: false }).limit(200),
  ]);
  if (pErr || lErr) { console.error("Supabase load failed", pErr || lErr); return null; }

  const phrases = (phraseRows || []).map(dbRowToPhrase);
  const links = (linkRows || []).map(dbRowToLink);

  const commentsByLink = {};
  for (const c of commentRows || []) {
    (commentsByLink[c.link_id] ||= []).push({ id: c.id, author: c.author, text: c.text, at: c.created_at });
  }
  for (const l of links) l.comments = commentsByLink[l.id] || [];

  const reportsByPhrase = {};
  for (const r of reportRows || []) {
    (reportsByPhrase[r.phrase_id] ||= []).push({ by: r.reported_by, reason: r.reason, text: r.text, at: r.created_at });
  }
  for (const p of phrases) p.reports = reportsByPhrase[p.id] || [];

  const activity = (activityRows || []).map((a) => ({ id: a.id, text: a.text, at: a.created_at }));
  return { phrases, links, activity };
}

async function seedDatabase(seed) {
  const phraseRows = seed.phrases.map((p) => ({
    id: p.id, text: p.text, owner: p.owner, created_at: p.createdAt,
    parent_a: null, parent_b: null, isolated: false, impact_bonus: 0,
  }));
  const activityRows = seed.activity.map((a) => ({ id: a.id, text: a.text, created_at: a.at }));
  const { error: pErr } = await sb.from("phrases").insert(phraseRows);
  if (pErr) console.error("Supabase seed (phrases) failed", pErr);
  const { error: aErr } = await sb.from("activity").insert(activityRows);
  if (aErr) console.error("Supabase seed (activity) failed", aErr);
}

async function resetDatabaseToSeed(seed) {
  // Children before parents, to respect the foreign-key constraints.
  await sb.from("comments").delete().neq("id", "__never__");
  await sb.from("links").delete().neq("id", "__never__");
  await sb.from("reports").delete().neq("id", "__never__");
  await sb.from("phrases").delete().neq("id", "__never__");
  await sb.from("activity").delete().neq("id", "__never__");
  await seedDatabase(seed);
}

function insertPhrase(p) {
  sb.from("phrases").insert({
    id: p.id, text: p.text, owner: p.owner, created_at: p.createdAt,
    parent_a: p.parents ? p.parents[0] : null, parent_b: p.parents ? p.parents[1] : null,
    isolated: false, impact_bonus: 0,
  }).then(({ error }) => { if (error) console.error("Supabase insert phrase failed", error); });
}

function insertLink(l) {
  sb.from("links").insert({
    id: l.id, source: l.source, target: l.target, weight: l.weight,
    type: l.type, created_at: l.createdAt,
  }).then(({ error }) => { if (error) console.error("Supabase insert link failed", error); });
}

// Atomic — see increment_link_weight() in supabase-schema.sql. Avoids the
// read-then-write race called out in 2.1 for this specific hot path.
function incrementLinkWeight(linkId) {
  sb.rpc("increment_link_weight", { p_link_id: linkId })
    .then(({ error }) => { if (error) console.error("Supabase increment weight failed", error); });
}

function incrementImpactBonus(phraseId) {
  sb.rpc("increment_impact_bonus", { p_phrase_id: phraseId })
    .then(({ error }) => { if (error) console.error("Supabase increment impact failed", error); });
}

function insertComment(linkId, c) {
  sb.from("comments").insert({
    id: c.id, link_id: linkId, author: c.author, text: c.text, created_at: c.at,
  }).then(({ error }) => { if (error) console.error("Supabase insert comment failed", error); });
}

function insertReport(phraseId, r) {
  sb.from("reports").insert({
    phrase_id: phraseId, reported_by: r.by, reason: r.reason, text: r.text, created_at: r.at,
  }).then(({ error }) => { if (error) console.error("Supabase insert report failed", error); });
}

function isolatePhraseInDB(phraseId) {
  sb.from("phrases").update({ isolated: true }).eq("id", phraseId)
    .then(({ error }) => { if (error) console.error("Supabase isolate failed", error); });
}

function insertActivityRow(entry) {
  sb.from("activity").insert({ id: entry.id, text: entry.text, created_at: entry.at })
    .then(({ error }) => { if (error) console.error("Supabase insert activity failed", error); });
}

function insertNotification(forUser, n) {
  sb.from("notifications").insert({
    id: n.id, for_user: forUser, message: n.message, phrase_id: n.phraseId,
    read: false, created_at: n.at,
  }).then(({ error }) => { if (error) console.error("Supabase insert notification failed", error); });
}

async function fetchNotificationsFor(user) {
  const { data, error } = await sb.from("notifications").select("*").eq("for_user", user).order("created_at", { ascending: false }).limit(50);
  if (error) { console.error("Supabase load notifications failed", error); return []; }
  return (data || []).map((n) => ({ id: n.id, message: n.message, phraseId: n.phrase_id, read: n.read, at: n.created_at }));
}

function markNotificationsReadInDB(user) {
  sb.from("notifications").update({ read: true }).eq("for_user", user).eq("read", false)
    .then(({ error }) => { if (error) console.error("Supabase mark-read failed", error); });
}

/* ============================================================ */
/* Constellation graph: physics + canvas rendering + hit-testing */
/* ============================================================ */

function createConstellationGraph(canvas, container, callbacks) {
  let nodes = [];
  let links = [];
  let sim = null;
  const transform = { zoom: 1, panX: 0, panY: 0 };
  const size = { w: 800, h: 600, dpr: 1 };
  let selectedIds = [];
  let linkFlashId = null;
  let drag = { mode: null };
  let hasFramedInitially = false;
  let cachedMinZoom = 0.15; // N1 — refreshed on rebuild()/resize(), read (not recomputed) on every wheel event

  // Offscreen context used only for measuring text width/height ahead of
  // time (1.5/1.6), independent of whatever the visible canvas last drew.
  const measureCtx = document.createElement("canvas").getContext("2d");

  const COLORS = {
    bg: "#08080a", ink: "#f3f2ee", inkDim: "#8c8b90",
    line: "rgba(232,231,238,0.16)", lineDerivation: "rgba(232,231,238,0.22)",
    accent: "#7fc9a0", accentDim: "rgba(127,201,160,0.35)",
  };

  // Below this on-screen pixel size, text stops being legible; a small
  // "sparkle" glyph stands in for the phrase instead of the text itself.
  const STAR_THRESHOLD_PX = 7;

  // Collision-radius padding/floor for 1.5, shared with rebuild() below.
  const COLLIDE_PADDING = 14;
  const MIN_COLLIDE_R = 20;

  function drawSparkle(ctx, cx, cy, outerR, color) {
    const innerR = outerR * 0.38;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const angle = (Math.PI / 4) * i - Math.PI / 2;
      const r = i % 2 === 0 ? outerR : innerR;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function impactOf(id) {
    let degree = 0;
    for (const l of links) {
      const s = typeof l.source === "object" ? l.source.id : l.source;
      const t = typeof l.target === "object" ? l.target.id : l.target;
      if (s === id) degree += l.weight || 1;
      if (t === id) degree += l.weight || 1;
    }
    const node = nodes.find((n) => n.id === id);
    const bonus = node && node.impactBonus ? node.impactBonus : 0;
    return degree + bonus;
  }

  function worldFontSizeFor(impact) {
    const raw = 13 + Math.log(1 + impact) * 6.5;
    return Math.min(raw, 40);
  }

  // 1.8/1.9 — bounding box of the current, visible (non-isolated) content,
  // used both to cap how far the user can zoom out (1.8) and to frame the
  // very first view of the map (1.9).
  function computeContentBounds() {
    const visible = nodes.filter((n) => !n.isolated && n.x != null);
    if (visible.length === 0) return null;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const n of visible) {
      const half = n._collideR || 30;
      minX = Math.min(minX, n.x - half);
      maxX = Math.max(maxX, n.x + half);
      minY = Math.min(minY, n.y - half);
      maxY = Math.max(maxY, n.y + half);
    }
    return { minX, maxX, minY, maxY };
  }

  function computeFitZoom(bounds, marginPx) {
    const boundsW = Math.max(1, bounds.maxX - bounds.minX);
    const boundsH = Math.max(1, bounds.maxY - bounds.minY);
    const fitZoomX = size.w / (boundsW + marginPx * 2);
    const fitZoomY = size.h / (boundsH + marginPx * 2);
    return Math.min(fitZoomX, fitZoomY);
  }

  // Comfortable on-screen text size, used only to protect the very first
  // framing of the map (below) — not the live zoom-out limit, since freely
  // zooming out into the sparkle fallback (1.2/1.3) is intentional and
  // shouldn't be blocked.
  const TARGET_LEGIBLE_PX = 13;

  function computeLegibilityZoom() {
    const visible = nodes.filter((n) => !n.isolated);
    if (visible.length === 0) return 1;
    let minFont = Infinity;
    for (const n of visible) minFont = Math.min(minFont, worldFontSizeFor(impactOf(n.id)));
    return TARGET_LEGIBLE_PX / minFont;
  }

  // 1.8 — the further out you can manually zoom is capped to the point
  // where the full visible set already fills the viewport with a margin:
  // with few phrases that point is close in (no giant empty canvas), and
  // it relaxes automatically as more phrases spread the layout out.
  function computeMinZoom() {
    const bounds = computeContentBounds();
    if (!bounds) return 0.15;
    const fitZoom = computeFitZoom(bounds, 60);
    return Math.min(1.4, Math.max(0.08, fitZoom));
  }

  function draw() {
    const ctx = canvas.getContext("2d");
    const { w, h, dpr } = size;
    const { zoom, panX, panY } = transform;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, w, h);
    ctx.save();
    ctx.translate(panX, panY);
    ctx.scale(zoom, zoom);

    const now = Date.now();

    for (const l of links) {
      const s = typeof l.source === "object" ? l.source : nodes.find((n) => n.id === l.source);
      const t = typeof l.target === "object" ? l.target : nodes.find((n) => n.id === l.target);
      if (!s || !t || s.x == null || t.x == null) continue;
      const isNew = now - new Date(l.createdAt).getTime() < 10 * 60000;
      const isFlash = l.id === linkFlashId;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(t.x, t.y);
      const width = (0.5 + Math.min(l.weight || 1, 6) * 0.35) / zoom;
      ctx.lineWidth = isFlash ? width * 1.8 : width;
      ctx.setLineDash(l.type === "derivation" ? [4 / zoom, 3 / zoom] : []);
      ctx.strokeStyle = isFlash ? COLORS.accent : isNew ? COLORS.accentDim : l.type === "derivation" ? COLORS.lineDerivation : COLORS.line;
      ctx.stroke();
      ctx.setLineDash([]);
    }

    for (const n of nodes) {
      if (n.isolated) continue;
      const impact = impactOf(n.id);
      const isNew = now - new Date(n.createdAt).getTime() < 10 * 60000;
      const isSel = selectedIds.includes(n.id);
      const color = isSel ? COLORS.ink : isNew ? COLORS.accent : impact > 0 ? COLORS.ink : COLORS.inkDim;

      // World-space font size (not divided by zoom): as the view zooms out,
      // ctx.scale(zoom) naturally shrinks it on screen — a continuous fade
      // with distance instead of a hard visibility cutoff.
      const worldFontSize = worldFontSizeFor(impact);
      const screenFontSize = worldFontSize * zoom;

      if (screenFontSize < STAR_THRESHOLD_PX) {
        // Too small to read at this zoom level: stand in with a small glyph
        // instead of vanishing outright.
        const worldStarRadius = (2.5 + Math.min(impact, 10) * 0.35);
        drawSparkle(ctx, n.x, n.y, worldStarRadius, color);
        n._w = worldStarRadius * 2;
        n._h = worldStarRadius * 2;
        continue;
      }

      ctx.font = `${isSel ? 600 : 400} ${worldFontSize}px Inter, -apple-system, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = color;
      ctx.fillText(n.text, n.x, n.y);

      const metrics = ctx.measureText(n.text);
      n._w = metrics.width;
      n._h = worldFontSize * 1.3;

      if (isSel) {
        ctx.beginPath();
        ctx.moveTo(n.x - n._w / 2, n.y + n._h / 2 + 3 / zoom);
        ctx.lineTo(n.x + n._w / 2, n.y + n._h / 2 + 3 / zoom);
        ctx.strokeStyle = COLORS.accent;
        ctx.lineWidth = 1 / zoom;
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function rebuild(phrases, linkData) {
    const existingById = new Map(nodes.map((n) => [n.id, n]));
    const w = size.w || 800, h = size.h || 600;
    nodes = phrases.map((p) => {
      const prev = existingById.get(p.id);
      return {
        ...p,
        x: prev ? prev.x : w / 2 + (Math.random() - 0.5) * 200,
        y: prev ? prev.y : h / 2 + (Math.random() - 0.5) * 200,
        vx: prev ? prev.vx : 0, vy: prev ? prev.vy : 0,
      };
    });
    const nodeIds = new Set(nodes.map((n) => n.id));
    links = linkData.filter((l) => nodeIds.has(l.source) && nodeIds.has(l.target)).map((l) => ({ ...l }));

    // 1.5 — precompute each node's real half-extent from its rendered text
    // (impact-driven font size + actual measured width), so collision radius
    // reflects a 2-word phrase and a 25-word phrase differently instead of
    // sharing one fixed radius.
    for (const n of nodes) {
      const worldFontSize = worldFontSizeFor(impactOf(n.id));
      measureCtx.font = `400 ${worldFontSize}px Inter, -apple-system, sans-serif`;
      const textW = measureCtx.measureText(n.text).width;
      const textH = worldFontSize * 1.3;
      n._collideR = Math.max(MIN_COLLIDE_R, Math.hypot(textW / 2, textH / 2) + COLLIDE_PADDING);
    }

    if (sim) sim.stop();
    sim = d3.forceSimulation(nodes)
      .force("charge", d3.forceManyBody().strength(-160))
      .force(
        "link",
        d3
          .forceLink(links)
          .id((d) => d.id)
          // 1.6 — distance scales with both phrases' real size, so
          // connecting two long phrases never pulls them closer than they'd
          // sit unconnected.
          .distance((d) => {
            const s = typeof d.source === "object" ? d.source : nodes.find((nn) => nn.id === d.source);
            const t = typeof d.target === "object" ? d.target : nodes.find((nn) => nn.id === d.target);
            const rs = s && s._collideR ? s._collideR : 30;
            const rt = t && t._collideR ? t._collideR : 30;
            return 24 + rs + rt;
          })
          .strength(0.25)
      )
      .force("center", d3.forceCenter(w / 2, h / 2))
      // Runs after "link" on every tick, so it also acts as the minimum-
      // separation guarantee from 1.6: no pair of nodes, connected or not,
      // can end up closer than the sum of their own text-based radii —
      // even if two phrases happened to start out very close together.
      .force("collide", d3.forceCollide().radius((d) => d._collideR))
      .alpha(0.9);

    // 1.9 — only on the very first population of the map: settle the
    // physics silently (no draw calls yet) and frame the camera on the
    // resulting bounding box, so the first thing anyone sees already
    // contains every phrase instead of a partial, still-scattering layout.
    if (!hasFramedInitially) {
      hasFramedInitially = true;

      // N2 — the number of synchronous pre-settle ticks now scales down as
      // the graph grows (constant "tick × node" budget), instead of always
      // running a flat 300 iterations regardless of size. Beyond
      // MAX_PRESETTLE_NODES the step is skipped entirely and the graph
      // simply animates into place live, so a large map can never freeze
      // the tab on load.
      const PRESETTLE_TICK_BUDGET = 6000;
      const MAX_PRESETTLE_TICKS = 300;
      const MAX_PRESETTLE_NODES = 2000;
      if (nodes.length > 0 && nodes.length <= MAX_PRESETTLE_NODES) {
        const presettleTicks = Math.min(MAX_PRESETTLE_TICKS, Math.max(20, Math.round(PRESETTLE_TICK_BUDGET / nodes.length)));
        for (let i = 0; i < presettleTicks; i++) sim.tick();
      }

      const PHRASE_FRAME_LIMIT = 50; // beyond this, a full-set overview
      // would force too extreme a zoom-out to stay legible — show a
      // representative portion at the default view instead.
      if (nodes.length > 0 && nodes.length <= PHRASE_FRAME_LIMIT) {
        const bounds = computeContentBounds();
        if (bounds) {
          // Never zoom out past the point where the smallest phrase would
          // stop being legible — if that conflicts with fitting every
          // phrase on screen, legibility wins and the view centers on as
          // many phrases as it can while keeping them readable.
          const rawFit = computeFitZoom(bounds, 60);
          const fitZoom = Math.min(4, Math.max(rawFit, computeLegibilityZoom(), 0.08));
          const cx = (bounds.minX + bounds.maxX) / 2;
          const cy = (bounds.minY + bounds.maxY) / 2;
          transform.zoom = fitZoom;
          transform.panX = size.w / 2 - cx * fitZoom;
          transform.panY = size.h / 2 - cy * fitZoom;
        }
      }
    }

    // N1 — the bounding-box-derived zoom-out limit is recomputed here, once
    // per rebuild, and cached; the wheel handler below just reads the
    // cached value instead of walking every node on each scroll tick.
    cachedMinZoom = computeMinZoom();

    sim.on("tick", draw);
    draw();
  }

  function resize() {
    const rect = container.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    size.w = rect.width; size.h = rect.height; size.dpr = dpr;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
    cachedMinZoom = computeMinZoom(); // viewport size changed, so the fit ratio did too
    draw();
  }
  new ResizeObserver(resize).observe(container);
  resize();
  setInterval(draw, 4000);

  function worldFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    return { wx: (sx - transform.panX) / transform.zoom, wy: (sy - transform.panY) / transform.zoom, sx, sy };
  }
  function hitNode(wx, wy) {
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      if (n.isolated || n._w == null) continue;
      if (wx >= n.x - n._w / 2 - 6 && wx <= n.x + n._w / 2 + 6 && wy >= n.y - n._h / 2 - 6 && wy <= n.y + n._h / 2 + 6) return n;
    }
    return null;
  }
  function hitLink(wx, wy, zoom) {
    const thresh = 6 / zoom;
    for (const l of links) {
      const s = typeof l.source === "object" ? l.source : nodes.find((n) => n.id === l.source);
      const t = typeof l.target === "object" ? l.target : nodes.find((n) => n.id === l.target);
      if (!s || !t || s.x == null) continue;
      const dx = t.x - s.x, dy = t.y - s.y;
      const lenSq = dx * dx + dy * dy || 1;
      let tt = ((wx - s.x) * dx + (wy - s.y) * dy) / lenSq;
      tt = Math.max(0, Math.min(1, tt));
      const px = s.x + tt * dx, py = s.y + tt * dy;
      if (Math.hypot(wx - px, wy - py) < thresh) return l;
    }
    return null;
  }

  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    const { wx, wy, sx, sy } = worldFromEvent(e);
    const node = hitNode(wx, wy);
    // Nodes are never manually repositioned — only d3-force decides where
    // they sit. A press on a node is either a click (no movement) or the
    // start of a canvas pan (if the pointer moves), never a node drag.
    drag = {
      mode: node ? "candidate-node" : "candidate-pan",
      node: node || null,
      startX: sx, startY: sy,
      moved: false,
      startPan: { ...transform },
    };
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!drag.mode) return;
    const { sx, sy } = worldFromEvent(e);
    const dist = Math.hypot(sx - drag.startX, sy - drag.startY);
    if (dist > 4) drag.moved = true;

    if (drag.moved) {
      drag.mode = "pan";
      transform.panX = drag.startPan.panX + (sx - drag.startX);
      transform.panY = drag.startPan.panY + (sy - drag.startY);
      draw();
    }
  });

  function handleUp(e) {
    if (!drag.mode) return;
    const { wx, wy } = worldFromEvent(e);
    if (drag.mode === "pan") {
      // panning already applied live in pointermove — nothing more to do
    } else if (drag.mode === "candidate-node") {
      callbacks.onNodeClick(drag.node.id);
    } else if (drag.mode === "candidate-pan") {
      const link = hitLink(wx, wy, transform.zoom);
      if (link) callbacks.onLinkClick(link.id);
      else callbacks.onBackgroundClick();
    }
    drag = { mode: null };
  }
  canvas.addEventListener("pointerup", handleUp);
  canvas.addEventListener("pointerleave", handleUp);

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const worldX = (sx - transform.panX) / transform.zoom;
    const worldY = (sy - transform.panY) / transform.zoom;
    const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    // 1.8/N1 — read the cached limit (refreshed on rebuild/resize) instead
    // of recomputing the whole bounding box on every scroll tick.
    const newZoom = Math.min(4, Math.max(cachedMinZoom, transform.zoom * factor));
    transform.panX = sx - worldX * newZoom;
    transform.panY = sy - worldY * newZoom;
    transform.zoom = newZoom;
    draw();
  }, { passive: false });

  return {
    setData(phrases, linkData) { rebuild(phrases, linkData); },
    setSelection(ids) { selectedIds = ids; draw(); },
    setLinkFlash(id) { linkFlashId = id; draw(); },
    focus(id) {
      const node = nodes.find((n) => n.id === id);
      if (!node) return;
      transform.zoom = 1.4;
      transform.panX = size.w / 2 - node.x * 1.4;
      transform.panY = size.h / 2 - node.y * 1.4;
      draw();
    },
  };
}

/* ============================================================ */
/* App state + rendering                                         */
/* ============================================================ */

const state = {
  me: null,
  nameDraft: "",
  nameError: null,
  graph: { phrases: [], links: [], activity: [] },
  notifByUser: {},
  composeOpen: false, composeText: "", composeError: null, composeDuplicate: null,
  selectedIds: [],
  combineOpen: false, combineText: "", combineError: null,
  reportTarget: null, reportReason: "spam", reportText: "",
  activeLinkId: null, linkFlashId: null, commentDraft: "",
  searchOpen: false, searchQuery: "",
  notifOpen: false, activityOpen: false,
};

let graphView = null;

function visiblePhrases() { return state.graph.phrases.filter((p) => !p.isolated); }
function phrasesById() {
  const map = {};
  for (const p of state.graph.phrases) map[p.id] = p;
  return map;
}

function requireIdentity() {
  if (!state.me) { window.alert("Choose a name in the top right before participating."); return false; }
  return true;
}

function logActivity(text) {
  const entry = { id: `a${Date.now()}${Math.random().toString(36).slice(2, 6)}`, text, at: new Date().toISOString() };
  state.graph.activity.unshift(entry);
  state.graph.activity = state.graph.activity.slice(0, 100);
  insertActivityRow(entry);
  return entry;
}

function notify(user, message, phraseId) {
  if (!user || user === state.me) return;
  const list = state.notifByUser[user] || [];
  const entry = { id: `n${Date.now()}${Math.random().toString(36).slice(2, 6)}`, message, phraseId, read: false, at: new Date().toISOString() };
  list.unshift(entry);
  state.notifByUser[user] = list.slice(0, 50);
  insertNotification(user, entry);
}

function cascadeAncestorBonus(directParentIds) {
  const byId = phrasesById();
  const visited = new Set(directParentIds);
  const queue = [...directParentIds];
  while (queue.length) {
    const id = queue.shift();
    const ph = byId[id];
    if (!ph || !ph.parents) continue;
    for (const gp of ph.parents) {
      if (visited.has(gp)) continue;
      visited.add(gp);
      const gpPhrase = byId[gp];
      if (gpPhrase) {
        gpPhrase.impactBonus = (gpPhrase.impactBonus || 0) + 1;
        incrementImpactBonus(gp);
        queue.push(gp);
      }
    }
  }
}

/* ---------------- render: top bar ---------------- */

function renderTopbar() {
  const el = document.getElementById("topbar-right");
  const unread = (state.me && (state.notifByUser[state.me] || []).filter((n) => !n.read).length) || 0;

  let searchHtml;
  if (state.searchOpen) {
    const results = state.searchQuery.trim()
      ? state.graph.phrases.filter((p) => !p.isolated && normalizeText(p.text).includes(normalizeText(state.searchQuery))).slice(0, 8)
      : [];
    searchHtml = `
      <div class="panel" id="search-box">
        <div class="row gap8">
          <input id="search-input" placeholder="search for a phrase…" value="${escapeHtml(state.searchQuery)}" style="flex:1;font-size:13px;" />
          <button class="text-btn" id="search-close" style="font-size:15px;">×</button>
        </div>
        ${results.length ? `<div style="margin-top:8px;border-top:1px solid var(--border);">
          ${results.map((p) => `<div class="search-result" data-id="${p.id}">${escapeHtml(p.text)}<div class="meta">${escapeHtml(p.owner)}</div></div>`).join("")}
        </div>` : ""}
      </div>`;
  } else {
    searchHtml = `<button class="ghost-btn" id="search-open">Search</button>`;
  }

  const notifHtml = `
    <div style="position:relative;">
      <button class="ghost-btn" id="notif-toggle">Notifications${unread ? ` · ${unread}` : ""}</button>
      ${state.notifOpen ? `<div class="panel" id="notif-dropdown">
        ${(state.me && state.notifByUser[state.me] || []).length === 0 ? `<div style="color:var(--ink-faint);font-size:13px;">No notifications yet.</div>` : ""}
        ${((state.me && state.notifByUser[state.me]) || []).map((n) => `<div class="notif-item">${escapeHtml(n.message)}<div class="meta">${relativeTime(n.at)}</div></div>`).join("")}
      </div>` : ""}
    </div>`;

  const identityHtml = state.me
    ? `<div class="panel" id="identity-pill">${escapeHtml(state.me)}</div>
       <button class="ghost-btn" id="reset-demo" title="Reset the example map">Reset</button>`
    : `<div class="col">
        <div class="panel" id="identity-form">
          <input id="name-input" placeholder="your name" value="${escapeHtml(state.nameDraft)}" maxlength="${NAME_MAX}" />
          <button class="text-btn" id="name-submit" style="color:var(--accent);">join</button>
        </div>
        ${state.nameError ? `<div id="identity-error">${escapeHtml(state.nameError)}</div>` : ""}
      </div>`;

  el.innerHTML = `${searchHtml}${notifHtml}${identityHtml}`;

  if (state.searchOpen) {
    document.getElementById("search-input").focus();
    document.getElementById("search-input").addEventListener("input", (e) => { state.searchQuery = e.target.value; renderTopbar(); });
    document.getElementById("search-close").addEventListener("click", () => { state.searchOpen = false; state.searchQuery = ""; renderTopbar(); });
    el.querySelectorAll(".search-result").forEach((n) => n.addEventListener("click", () => focusOnPhrase(n.dataset.id)));
  } else {
    document.getElementById("search-open").addEventListener("click", () => { state.searchOpen = true; renderTopbar(); });
  }
  document.getElementById("notif-toggle").addEventListener("click", () => {
    state.notifOpen = !state.notifOpen;
    if (state.notifOpen && state.me) {
      (state.notifByUser[state.me] || []).forEach((n) => (n.read = true));
      markNotificationsReadInDB(state.me);
    }
    renderTopbar();
  });
  if (state.me) {
    document.getElementById("reset-demo").addEventListener("click", resetDemo);
  } else {
    const input = document.getElementById("name-input");
    const submit = () => saveIdentity(input.value);
    document.getElementById("name-submit").addEventListener("click", submit);
    input.addEventListener("input", (e) => {
      state.nameDraft = e.target.value;
      state.nameError = null;
      const errEl = document.getElementById("identity-error");
      if (errEl) errEl.remove();
    });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  }
}

async function saveIdentity(name) {
  // 1.7 — validate length + allowed characters before accepting a name;
  // show the error inline in #identity-form instead of failing silently.
  const err = validateUsername(name);
  if (err) {
    state.nameDraft = (name || "").trim();
    state.nameError = err;
    renderTopbar();
    return;
  }
  state.me = name.trim();
  state.nameError = null;
  await savePersonal("me", state.me);
  state.notifByUser[state.me] = await fetchNotificationsFor(state.me);
  renderTopbar();
}

function focusOnPhrase(id) {
  graphView.focus(id);
  state.selectedIds = [id];
  graphView.setSelection(state.selectedIds);
  state.searchOpen = false; state.searchQuery = "";
  renderTopbar(); renderInspector();
}

async function resetDemo() {
  const fresh = seedGraph();
  await resetDatabaseToSeed(fresh);
  state.graph = fresh;
  graphView.setData(visiblePhrases(), fresh.links);
  renderActivity();
}

/* ---------------- render: activity ---------------- */

function renderActivity() {
  const el = document.getElementById("activity-panel");
  el.innerHTML = `
    <button id="activity-toggle" style="width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;color:var(--ink-dim);font-size:12px;padding:8px 12px;cursor:pointer;font-family:inherit;">
      <span>Recent activity</span><span>${state.activityOpen ? "−" : "+"}</span>
    </button>
    ${state.activityOpen ? `<div id="activity-list">
      ${state.graph.activity.slice(0, 30).map((a) => `<div class="activity-item">${escapeHtml(a.text)}<div class="meta">${relativeTime(a.at)}</div></div>`).join("")}
    </div>` : ""}
  `;
  document.getElementById("activity-toggle").addEventListener("click", () => { state.activityOpen = !state.activityOpen; renderActivity(); });
}

/* ---------------- render: compose ---------------- */

function renderCompose() {
  const el = document.getElementById("compose-area");
  if (!state.composeOpen) {
    el.innerHTML = `<button id="compose-fab">+ Write a phrase</button>`;
    document.getElementById("compose-fab").addEventListener("click", () => {
      state.composeOpen = true; state.composeText = ""; state.composeError = null; state.composeDuplicate = null;
      renderCompose();
    });
    return;
  }
  el.innerHTML = `
    <div class="panel" id="compose-panel">
      <textarea id="compose-text" rows="3" placeholder="between 2 and 25 words…" style="width:100%;">${escapeHtml(state.composeText)}</textarea>
      ${state.composeError ? `<div style="color:var(--danger);font-size:12px;margin-top:6px;">${escapeHtml(state.composeError)}</div>` : ""}
      ${state.composeDuplicate && !state.composeError ? `<div style="color:var(--danger);font-size:12px;margin-top:6px;">Something nearly identical already exists, by ${escapeHtml(state.composeDuplicate.owner)}: “${escapeHtml(state.composeDuplicate.text)}”</div>` : ""}
      <div class="row between" style="margin-top:12px;">
        <button class="text-btn" id="compose-cancel">cancel</button>
        <button class="solid-btn" id="compose-submit" ${state.composeDuplicate ? "disabled style=\"background:var(--ink-faint);\"" : ""}>publish</button>
      </div>
    </div>`;
  const ta = document.getElementById("compose-text");
  ta.focus();
  ta.addEventListener("input", (e) => {
    state.composeText = e.target.value;
    state.composeError = null;
    state.composeDuplicate = e.target.value.trim() ? findDuplicate(e.target.value, state.graph.phrases) : null;
    renderCompose();
    const freshTa = document.getElementById("compose-text");
    const len = freshTa.value.length;
    freshTa.setSelectionRange(len, len);
  });
  document.getElementById("compose-cancel").addEventListener("click", () => { state.composeOpen = false; renderCompose(); });
  document.getElementById("compose-submit").addEventListener("click", submitCompose);
}

function submitCompose() {
  if (!requireIdentity()) return;
  const err = validatePhraseText(state.composeText);
  if (err) { state.composeError = err; renderCompose(); return; }
  const dup = findDuplicate(state.composeText, state.graph.phrases);
  if (dup) { state.composeDuplicate = dup; renderCompose(); return; }
  const id = `p${Date.now()}${Math.random().toString(36).slice(2, 6)}`;
  const text = state.composeText.trim();
  const phrase = { id, text, owner: state.me, createdAt: new Date().toISOString(), parents: null, reports: [], isolated: false, impactBonus: 0 };
  state.graph.phrases.push(phrase);
  insertPhrase(phrase);
  logActivity(`${state.me} wrote “${text}”`);
  graphView.setData(visiblePhrases(), state.graph.links);
  renderActivity();
  state.composeOpen = false;
  renderCompose();
}

/* ---------------- selection / inspector / connect / combine ---------------- */

function handleNodeClick(id) {
  state.activeLinkId = null;
  if (state.selectedIds.includes(id)) state.selectedIds = state.selectedIds.filter((x) => x !== id);
  else if (state.selectedIds.length >= 2) state.selectedIds = [state.selectedIds[1], id];
  else state.selectedIds = [...state.selectedIds, id];
  graphView.setSelection(state.selectedIds);
  renderInspector(); renderCommentDrawer();
}
function handleLinkClick(id) {
  state.selectedIds = []; graphView.setSelection(state.selectedIds);
  state.activeLinkId = id; state.commentDraft = "";
  renderInspector(); renderCommentDrawer();
}
function handleBackgroundClick() {
  state.selectedIds = []; graphView.setSelection(state.selectedIds);
  state.activeLinkId = null;
  renderInspector(); renderCommentDrawer();
}

function renderInspector() {
  const el = document.getElementById("inspector-area");
  const byId = phrasesById();

  if (state.combineOpen && state.selectedIds.length === 2) {
    el.innerHTML = `
      <div class="panel" id="inspector-panel">
        <div style="font-size:12px;color:var(--ink-faint);margin-bottom:8px;">Write a phrase that merges the meaning of both:</div>
        <textarea id="combine-text" rows="3" style="width:100%;border:1px solid var(--border);border-radius:4px;padding:8px;">${escapeHtml(state.combineText)}</textarea>
        ${state.combineError ? `<div style="color:var(--danger);font-size:12px;margin-top:6px;">${escapeHtml(state.combineError)}</div>` : ""}
        <div class="row between" style="margin-top:12px;">
          <button class="text-btn" id="combine-cancel">cancel</button>
          <button class="solid-btn" id="combine-submit">create phrase</button>
        </div>
      </div>`;
    const ta = document.getElementById("combine-text");
    ta.focus();
    ta.addEventListener("input", (e) => { state.combineText = e.target.value; state.combineError = null; });
    document.getElementById("combine-cancel").addEventListener("click", () => { state.combineOpen = false; renderInspector(); });
    document.getElementById("combine-submit").addEventListener("click", submitCombine);
    return;
  }

  if (state.selectedIds.length === 2) {
    const [a, b] = state.selectedIds.map((id) => byId[id]);
    el.innerHTML = `
      <div class="panel" id="inspector-panel">
        <div style="font-size:13px;line-height:1.5;">“${escapeHtml(a?.text)}”<br/><span style="color:var(--ink-faint);">+</span><br/>“${escapeHtml(b?.text)}”</div>
        <div class="row gap8" style="margin-top:12px;">
          <button class="ghost-btn" id="do-connect" style="flex:1;">connect</button>
          <button class="solid-btn" id="do-combine" style="flex:1;">combine</button>
        </div>
      </div>`;
    document.getElementById("do-connect").addEventListener("click", doConnect);
    document.getElementById("do-combine").addEventListener("click", openCombine);
    return;
  }

  if (state.selectedIds.length === 1) {
    const p = byId[state.selectedIds[0]];
    if (!p) { el.innerHTML = ""; return; }
    el.innerHTML = `
      <div class="panel" id="inspector-panel">
        <div style="font-size:15px;line-height:1.4;">${escapeHtml(p.text)}</div>
        <div class="meta" style="margin-top:6px;">${escapeHtml(p.owner)} · ${relativeTime(p.createdAt)}</div>
        <div style="font-size:11px;color:var(--ink-faint);margin-top:10px;">Select another phrase on the map to connect or combine it with this one.</div>
        <div class="row" style="justify-content:flex-end;margin-top:12px;">
          <button class="text-btn" id="do-report">report</button>
        </div>
      </div>`;
    document.getElementById("do-report").addEventListener("click", () => openReport(p.id));
    return;
  }

  el.innerHTML = "";
}

function doConnect() {
  if (!requireIdentity() || state.selectedIds.length !== 2) return;
  const [a, b] = state.selectedIds;
  const pa = state.graph.phrases.find((p) => p.id === a);
  const pb = state.graph.phrases.find((p) => p.id === b);
  const existing = state.graph.links.find((l) => (l.source === a && l.target === b) || (l.source === b && l.target === a));
  let flashId;
  if (existing) {
    existing.weight = (existing.weight || 1) + 1;
    flashId = existing.id;
    incrementLinkWeight(existing.id);
  } else {
    const id = `l${Date.now()}${Math.random().toString(36).slice(2, 6)}`;
    const link = { id, source: a, target: b, weight: 1, type: "connection", createdAt: new Date().toISOString(), comments: [] };
    state.graph.links.push(link);
    flashId = id;
    insertLink(link);
  }
  logActivity(`${state.me} connected “${pa.text}” with “${pb.text}”`);
  if (pa && pa.owner !== state.me) notify(pa.owner, `${state.me} connected your phrase “${pa.text}” with another one.`, pa.id);
  if (pb && pb.owner !== state.me) notify(pb.owner, `${state.me} connected your phrase “${pb.text}” with another one.`, pb.id);

  graphView.setData(visiblePhrases(), state.graph.links);
  renderActivity();
  graphView.setLinkFlash(flashId);
  setTimeout(() => graphView.setLinkFlash(null), 1600);

  state.selectedIds = []; graphView.setSelection(state.selectedIds);
  renderInspector();
}

function openCombine() {
  if (!requireIdentity() || state.selectedIds.length !== 2) return;
  state.combineOpen = true; state.combineText = ""; state.combineError = null;
  renderInspector();
}

function submitCombine() {
  const err = validatePhraseText(state.combineText);
  if (err) { state.combineError = err; renderInspector(); return; }
  const dup = findDuplicate(state.combineText, state.graph.phrases);
  if (dup) { state.combineError = `An equivalent phrase already exists, by ${dup.owner}.`; renderInspector(); return; }
  const [a, b] = state.selectedIds;
  const pa = state.graph.phrases.find((p) => p.id === a);
  const pb = state.graph.phrases.find((p) => p.id === b);
  const newId = `p${Date.now()}${Math.random().toString(36).slice(2, 6)}`;
  const text = state.combineText.trim();
  const createdAt = new Date().toISOString();

  const phrase = { id: newId, text, owner: state.me, createdAt, parents: [a, b], reports: [], isolated: false, impactBonus: 0 };
  state.graph.phrases.push(phrase);
  insertPhrase(phrase);

  const linkA = { id: `l${Date.now()}a`, source: newId, target: a, weight: 1, type: "derivation", createdAt, comments: [] };
  const linkB = { id: `l${Date.now()}b`, source: newId, target: b, weight: 1, type: "derivation", createdAt, comments: [] };
  state.graph.links.push(linkA, linkB);
  insertLink(linkA);
  insertLink(linkB);

  cascadeAncestorBonus([a, b]);

  logActivity(`${state.me} combined “${pa.text}” + “${pb.text}” into “${text}”`);
  if (pa && pa.owner !== state.me) notify(pa.owner, `${state.me} combined your phrase “${pa.text}” into a new one.`, pa.id);
  if (pb && pb.owner !== state.me) notify(pb.owner, `${state.me} combined your phrase “${pb.text}” into a new one.`, pb.id);

  graphView.setData(visiblePhrases(), state.graph.links);
  renderActivity();

  state.combineOpen = false; state.selectedIds = []; graphView.setSelection(state.selectedIds);
  renderInspector();
}

/* ---------------- reports ---------------- */

function openReport(phraseId) {
  if (!requireIdentity()) return;
  state.reportTarget = phraseId; state.reportReason = "spam"; state.reportText = "";
  renderReport();
}

function renderReport() {
  const el = document.getElementById("report-area");
  if (!state.reportTarget) { el.innerHTML = ""; return; }
  el.innerHTML = `
    <div id="report-overlay">
      <div class="panel" id="report-panel">
        <div style="font-size:14px;margin-bottom:10px;">Report this phrase</div>
        <div style="margin-bottom:12px;">
          ${REPORT_REASONS.map((r) => `
            <label class="reason">
              <input type="radio" name="reason" value="${r.key}" ${state.reportReason === r.key ? "checked" : ""}/>
              ${escapeHtml(r.label)}
            </label>`).join("")}
        </div>
        <textarea id="report-text" rows="3" placeholder="briefly explain why…" style="width:100%;border:1px solid var(--border);border-radius:4px;padding:8px;">${escapeHtml(state.reportText)}</textarea>
        <div class="row between" style="margin-top:12px;">
          <button class="text-btn" id="report-cancel">cancel</button>
          <button id="report-submit" style="background:var(--danger);color:#fff;border:none;padding:8px 16px;border-radius:4px;font-size:13px;cursor:pointer;font-family:inherit;">send report</button>
        </div>
      </div>
    </div>`;
  el.querySelectorAll('input[name="reason"]').forEach((r) => r.addEventListener("change", (e) => (state.reportReason = e.target.value)));
  document.getElementById("report-text").addEventListener("input", (e) => (state.reportText = e.target.value));
  document.getElementById("report-cancel").addEventListener("click", () => { state.reportTarget = null; renderReport(); });
  document.getElementById("report-submit").addEventListener("click", submitReport);
}

function submitReport() {
  if (!state.reportTarget || !state.reportText.trim()) return;
  const phrase = state.graph.phrases.find((p) => p.id === state.reportTarget);
  if (phrase) {
    phrase.reports = phrase.reports || [];
    if (!phrase.reports.some((r) => r.by === state.me)) {
      const report = { by: state.me, reason: state.reportReason, text: state.reportText.trim(), at: new Date().toISOString() };
      phrase.reports.push(report);
      insertReport(phrase.id, report);
    }
    const reasonMeta = REPORT_REASONS.find((r) => r.key === state.reportReason);
    const distinctReporters = new Set(phrase.reports.map((r) => r.by)).size;
    if ((reasonMeta && reasonMeta.severe) || distinctReporters >= ISOLATION_THRESHOLD) {
      phrase.isolated = true;
      isolatePhraseInDB(phrase.id);
      logActivity("A phrase was removed from exploration after being reported.");
    }
  }
  graphView.setData(visiblePhrases(), state.graph.links);
  renderActivity();
  state.reportTarget = null; state.selectedIds = []; graphView.setSelection(state.selectedIds);
  renderReport(); renderInspector();
}

/* ---------------- comments ---------------- */

function renderCommentDrawer() {
  const el = document.getElementById("comment-area");
  const link = state.graph.links.find((l) => l.id === state.activeLinkId);
  if (!link) { el.innerHTML = ""; return; }
  const byId = phrasesById();
  const s = byId[link.source], t = byId[link.target];
  el.innerHTML = `
    <div id="comment-drawer-wrap">
      <div class="panel" id="comment-drawer">
        <div class="row between" style="padding:12px 16px;border-bottom:1px solid var(--border);">
          <div style="font-size:12px;color:var(--ink-dim);">“${escapeHtml(s?.text)}” — “${escapeHtml(t?.text)}”</div>
          <button class="text-btn" id="close-comments" style="font-size:15px;">×</button>
        </div>
        <div id="comment-list" style="overflow-y:auto;padding:8px 16px;flex:1;">
          ${(link.comments || []).length === 0 ? `<div style="color:var(--ink-faint);font-size:13px;padding:10px 0;">No comments on this connection yet.</div>` : ""}
          ${(link.comments || []).map((c) => `<div class="comment-item"><div style="font-size:13px;">${escapeHtml(c.text)}</div><div class="meta">${escapeHtml(c.author)} · ${relativeTime(c.at)}</div></div>`).join("")}
        </div>
        <div class="row gap8" style="padding:12px 16px;border-top:1px solid var(--border);">
          <input id="comment-input" placeholder="explain the connection…" value="${escapeHtml(state.commentDraft)}" style="flex:1;font-size:13px;" />
          <button class="text-btn" id="comment-send" style="color:var(--accent);font-size:15px;">➤</button>
        </div>
      </div>
    </div>`;
  document.getElementById("close-comments").addEventListener("click", () => { state.activeLinkId = null; renderCommentDrawer(); });
  const input = document.getElementById("comment-input");
  input.addEventListener("input", (e) => (state.commentDraft = e.target.value.slice(0, COMMENT_MAX)));
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") submitComment(); });
  document.getElementById("comment-send").addEventListener("click", submitComment);
}

function submitComment() {
  if (!requireIdentity() || !state.activeLinkId) return;
  const text = state.commentDraft.trim().slice(0, COMMENT_MAX);
  if (!text) return;
  const link = state.graph.links.find((l) => l.id === state.activeLinkId);
  if (link) {
    const comment = { id: `c${Date.now()}`, author: state.me, text, at: new Date().toISOString() };
    link.comments = link.comments || [];
    link.comments.push(comment);
    insertComment(link.id, comment);
    const byId = phrasesById();
    logActivity(`${state.me} commented on the connection between “${byId[link.source]?.text}” and “${byId[link.target]?.text}”`);
    renderActivity();
  }
  state.commentDraft = "";
  renderCommentDrawer();
}

/* ============================================================ */
/* Boot                                                           */
/* ============================================================ */

(async function boot() {
  if (!sb) {
    document.getElementById("loading-screen").innerHTML = `
      <div style="max-width:440px;text-align:center;padding:24px;line-height:1.6;">
        <div style="font-size:14px;margin-bottom:10px;">Supabase isn't configured yet.</div>
        <div style="font-size:12px;color:var(--ink-faint);">
          Open this file, find <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code>
          near the top of the &lt;script&gt; tag, and fill them in with your
          project's values (Settings → API). Run <code>supabase-schema.sql</code>
          in the SQL editor first — see SETUP.md.
        </div>
      </div>`;
    return;
  }

  state.me = await loadPersonal("me", null);

  let graph = await fetchGraphFromDB();
  if (!graph) {
    document.getElementById("loading-screen").innerHTML = `
      <div style="max-width:440px;text-align:center;padding:24px;line-height:1.6;">
        <div style="font-size:14px;margin-bottom:10px;">Couldn't reach Supabase.</div>
        <div style="font-size:12px;color:var(--ink-faint);">
          Double-check SUPABASE_URL/SUPABASE_ANON_KEY and that
          supabase-schema.sql has been run (open the browser console for
          the exact error).
        </div>
      </div>`;
    return;
  }
  if (graph.phrases.length === 0) {
    const seed = seedGraph();
    await seedDatabase(seed);
    graph = await fetchGraphFromDB();
  }
  state.graph = graph;

  if (state.me) state.notifByUser[state.me] = await fetchNotificationsFor(state.me);

  document.getElementById("loading-screen").style.display = "none";
  document.getElementById("app").style.display = "block";

  const canvas = document.getElementById("graph-canvas");
  const container = document.getElementById("app");
  graphView = createConstellationGraph(canvas, container, {
    onNodeClick: handleNodeClick,
    onLinkClick: handleLinkClick,
    onBackgroundClick: handleBackgroundClick,
  });
  graphView.setData(visiblePhrases(), state.graph.links);

  renderTopbar();
  renderActivity();
  renderCompose();
  renderInspector();
  renderReport();
  renderCommentDrawer();
})();
</script>
</body>
</html>
